name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1 — Pre-check : validation YAML & Python
  # ─────────────────────────────────────────────
  pre-check:
    name: "Pre-check: YAML & Python syntax"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate YAML files
        run: python scripts/check_yaml.py

      - name: Validate Python syntax
        run: python scripts/check_python.py

  # ─────────────────────────────────────────────
  # STAGE 2 — Tests : exécution des tests pytest
  # ─────────────────────────────────────────────
  test:
    name: "Tests: pytest"
    runs-on: ubuntu-latest
    needs: pre-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with junit output
        run: |
          pytest -v \
            --junitxml=report/junit.xml \
            --tb=short

      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: report/junit.xml

  # ─────────────────────────────────────────────
  # STAGE 3 — Rapport : génération HTML
  # ─────────────────────────────────────────────
  report:
    name: "Report: HTML generation"
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate HTML report
        run: |
          pytest -v \
            --html=report/test-report.html \
            --self-contained-html \
            --tb=short
        continue-on-error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: report/test-report.html

      - name: Print test summary
        if: always()
        run: |
          echo "=== Rapport de tests généré ==="
          echo "Artifact: html-test-report"
          echo "Fichier : report/test-report.html"
